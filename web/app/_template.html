<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang mẫu — Cổng thông tin Đào tạo tín chỉ — UTH</title>
    <link rel="icon" type="image/png" href="/images/logo_spinner.png">
    <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
    <!-- Layout (topbar + header logo trường + thanh menu + breadcrumb + footer)
         do renderLayout() trong js/shared.js tự dựng — chỉ cần giữ nguyên
         cấu trúc header/main/footer bên dưới. Duong dan asset co the tuong doi
         (../css, ../../css) hoac tuy doi (/css, /js) — deu chay dung. -->
    <header class="app-header">
        <div class="app-header__brand">
            <span class="app-header__logo">🎓</span>
            <h1 class="app-header__title">Tiêu đề trang</h1>
        </div>
        <nav class="app-nav" id="app-nav"></nav>
        <div class="app-header__user" id="app-user"></div>
    </header>

    <main class="container">
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">Nội dung</h2>
                <button class="btn btn--primary" onclick="themMoi()">+ Thêm mới</button>
            </div>
            <div class="toolbar">
                <input type="search" id="search-input" class="input" placeholder="🔍 Tìm kiếm..." oninput="render()">
                <select id="filter" class="input input--select" onchange="render()">
                    <option value="">Tất cả</option>
                </select>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Cột 1</th>
                        <th>Cột 2</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <p class="card__note" id="empty" style="display:none">Không có dữ liệu.</p>
        </section>
    </main>

    <footer class="app-footer"><p>Đồ án Hệ Quản trị CSDL — Nhóm 5</p></footer>
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal thêm/sửa -->
    <div class="modal-mask hidden" id="modal-mask">
        <div class="modal">
            <h3 id="modal-title">Thêm mới</h3>
            <form id="modal-form">
                <div class="form-group"><label>Trường</label><input class="input" id="f-field" required></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn--outline" onclick="dongModal()">Hủy</button>
                    <button type="submit" class="btn btn--primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shared.js"></script>
    <script>
        /* Page logic here */
    </script>
</body>
</html>
