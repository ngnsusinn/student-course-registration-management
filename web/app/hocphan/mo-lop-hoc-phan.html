<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở lớp học phần — Cổng thông tin Đào tạo tín chỉ — UTH</title>
    <link rel="icon" type="image/png" href="/images/logo_spinner.png">
    <link rel="stylesheet" href="../../css/shared.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header__brand">
            <span class="app-header__logo">🎓</span>
            <h1 class="app-header__title">Mở lớp học phần</h1>
        </div>
        <nav class="app-nav" id="app-nav"></nav>
        <div class="app-header__user" id="app-user"></div>
    </header>

    <main class="container">
        <!-- Mở lớp học phần mới -->
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">📦 Mở lớp học phần mới</h2>
                <span class="card__note">Lớp mới được tạo ở trạng thái Mở đăng ký, kèm 1 lịch học (thứ, tiết, phòng).</span>
            </div>
            <form id="form-molop">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="f-malhp">Mã lớp học phần *</label>
                        <input type="text" class="input w-100" id="f-malhp" placeholder="VD: CNTT001" required>
                    </div>
                    <div class="form-group">
                        <label for="f-tenlhp">Tên lớp học phần *</label>
                        <input type="text" class="input w-100" id="f-tenlhp" placeholder="VD: Lập trình C cơ bản" required>
                    </div>
                    <div class="form-group">
                        <label for="f-mamonhoc">Môn học *</label>
                        <select id="f-mamonhoc" class="input input--select w-100" required>
                            <option value="">— Chọn môn học —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-mahocky">Học kỳ *</label>
                        <select id="f-mahocky" class="input input--select w-100" required>
                            <option value="">— Chọn học kỳ —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-magv">Giảng viên *</label>
                        <select id="f-magv" class="input input--select w-100" required>
                            <option value="">— Chọn giảng viên —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-sisotoida">Sĩ số tối đa *</label>
                        <input type="number" class="input w-100" id="f-sisotoida" min="1" max="200" placeholder="VD: 60" required>
                    </div>
                    <div class="form-group">
                        <label for="f-maphong">Phòng học *</label>
                        <select id="f-maphong" class="input input--select w-100" required>
                            <option value="">— Chọn phòng —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-thu">Thứ *</label>
                        <select id="f-thu" class="input input--select w-100" required>
                            <option value="">— Chọn thứ —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="f-tietbatdau">Tiết bắt đầu (1–15) *</label>
                        <input type="number" class="input w-100" id="f-tietbatdau" min="1" max="15" placeholder="VD: 1" required>
                    </div>
                    <div class="form-group">
                        <label for="f-sotiet">Số tiết (1–6) *</label>
                        <input type="number" class="input w-100" id="f-sotiet" min="1" max="6" placeholder="VD: 3" required>
                    </div>
                </div>
                <button type="submit" class="btn btn--primary">Mở lớp</button>
            </form>
        </section>

        <!-- Danh sách lớp học phần -->
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">📋 Danh sách lớp học phần</h2>
                <button class="btn btn--outline btn--sm" onclick="loadLHP()">⟳ Làm mới</button>
            </div>
            <p class="card__note" id="list-note" style="display:none"></p>
            <table class="table">
                <thead>
                    <tr>
                        <th>Mã LHP</th>
                        <th>Tên lớp</th>
                        <th>Môn học</th>
                        <th>Học kỳ</th>
                        <th>Giảng viên</th>
                        <th>Sĩ số</th>
                        <th>Lịch học</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="lhp-body"></tbody>
            </table>
            <p class="card__note" id="lhp-empty" style="display:none">Không có dữ liệu.</p>
        </section>
    </main>

    <footer class="app-footer"><p>Đồ án Hệ Quản trị CSDL — Nhóm 5</p></footer>
    <div id="toast-container" class="toast-container"></div>

    <script src="../../js/api.js"></script>
    <script src="../../js/shared.js"></script>
    <script>
        (function () {
            if (!requireAuth('PĐT')) return;

            // ---------- Mở lớp học phần ----------
            document.getElementById('form-molop').addEventListener('submit', async e => {
                e.preventDefault();
                const get = id => document.getElementById(id).value.trim();
                const body = {
                    MaLHP: get('f-malhp'),
                    TenLHP: get('f-tenlhp'),
                    MaMonHoc: get('f-mamonhoc'),
                    MaHocKy: get('f-mahocky'),
                    MaGV: get('f-magv'),
                    SiSoToiDa: Number(get('f-sisotoida')),
                    MaPhong: get('f-maphong'),
                    Thu: Number(get('f-thu')),
                    TietBatDau: Number(get('f-tietbatdau')),
                    SoTiet: Number(get('f-sotiet')),
                };
                const required = ['MaLHP', 'TenLHP', 'MaMonHoc', 'MaHocKy', 'MaGV', 'MaPhong', 'Thu', 'TietBatDau', 'SoTiet'];
                for (const k of required) {
                    if (!body[k]) {
                        return showToast('Vui lòng điền đầy đủ thông tin (thiếu: ' + k + ').', 'error');
                    }
                }
                if (!(body.SiSoToiDa > 0)) return showToast('Sĩ số tối đa phải lớn hơn 0.', 'error');
                if (!(body.Thu >= 2 && body.Thu <= 8)) return showToast('Thứ phải từ 2 đến 8.', 'error');
                if (!(body.TietBatDau >= 1 && body.TietBatDau <= 15)) return showToast('Tiết bắt đầu phải từ 1 đến 15.', 'error');
                if (!(body.SoTiet >= 1 && body.SoTiet <= 6)) return showToast('Số tiết phải từ 1 đến 6.', 'error');

                try {
                    await api.post('/api/admin/molophocphan', body);
                    showToast('Mở lớp học phần thành công.', 'success');
                    e.target.reset();
                    loadLHP();
                } catch (err) {
                    showToast(err.message || 'Mở lớp học phần thất bại.', 'error');
                }
            });

            // ---------- Danh mục ----------
            async function loadDanhMuc() {
                try {
                    const [mh, hk, gv, ph] = await Promise.all([
                        api.get('/api/danhmuc/monhoc'),
                        api.get('/api/danhmuc/hocky'),
                        api.get('/api/danhmuc/giangvien'),
                        api.get('/api/danhmuc/phonghoc'),
                    ]);
                    document.getElementById('f-mamonhoc').innerHTML =
                        '<option value="">— Chọn môn học —</option>' +
                        (mh.monHoc || []).map(m => '<option value="' + esc(m.MaMonHoc) + '">' + esc(m.MaMonHoc) + ' — ' + esc(m.TenMonHoc) + '</option>').join('');
                    document.getElementById('f-mahocky').innerHTML =
                        '<option value="">— Chọn học kỳ —</option>' +
                        (hk.hocKy || []).map(h => '<option value="' + esc(h.MaHocKy) + '">' + esc(h.TenHocKy) + ' (' + esc(h.NamHoc) + ')</option>').join('');
                    document.getElementById('f-magv').innerHTML =
                        '<option value="">— Chọn giảng viên —</option>' +
                        (gv.giangVien || []).map(g => '<option value="' + esc(g.MaGV) + '">' + esc(g.MaGV) + ' — ' + esc(g.HoTen) + '</option>').join('');
                    document.getElementById('f-maphong').innerHTML =
                        '<option value="">— Chọn phòng —</option>' +
                        (ph.phongHoc || []).map(p => '<option value="' + esc(p.MaPhong) + '">' + esc(p.MaPhong) + ' — ' + esc(p.TenPhong) + '</option>').join('');
                    document.getElementById('f-thu').innerHTML =
                        '<option value="">— Chọn thứ —</option>' +
                        [2, 3, 4, 5, 6, 7, 8].map(t => '<option value="' + t + '">' + thuName(t) + '</option>').join('');
                } catch (e) {
                    showToast(e.message || 'Không tải được danh mục.', 'error');
                }
            }

            // ---------- Danh sách lớp học phần ----------
            function renderLHP(rows) {
                const tbody = document.getElementById('lhp-body');
                const empty = document.getElementById('lhp-empty');
                if (!rows.length) {
                    tbody.innerHTML = '';
                    empty.style.display = '';
                    return;
                }
                empty.style.display = 'none';
                tbody.innerHTML = rows.map(r => {
                    const siSo = (r.SiSoHienTai !== undefined && r.SiSoToiDa !== undefined)
                        ? formatTiSo(r.SiSoHienTai, r.SiSoToiDa)
                        : (r.SiSoToiDa !== undefined ? esc(r.SiSoToiDa) : '—');
                    const monHoc = r.TenMonHoc
                        ? esc(r.TenMonHoc) + ' <span class="text-muted">(' + esc(r.MaMonHoc || '') + ')</span>'
                        : esc(r.MaMonHoc || '—');
                    const hocky = r.TenHocKy
                        ? esc(r.TenHocKy) + ' <span class="text-muted">(' + esc(r.NamHoc || '') + ')</span>'
                        : esc(r.MaHocKy || '—');
                    const gv = r.TenGV || r.MaGV || '—';
                    return '<tr>' +
                        '<td><code>' + esc(r.MaLHP) + '</code></td>' +
                        '<td>' + esc(r.TenLHP || '') + '</td>' +
                        '<td>' + monHoc + '</td>' +
                        '<td>' + hocky + '</td>' +
                        '<td>' + esc(gv) + '</td>' +
                        '<td>' + siSo + '</td>' +
                        '<td>' + esc(r.LichHoc || '—') + '</td>' +
                        '<td>' + badgeTrangThaiLop(r.TrangThaiLop) + '</td>' +
                    '</tr>';
                }).join('');
            }

            async function loadLHP() {
                const note = document.getElementById('list-note');
                let rows = null;
                try {
                    // Endpoint dành riêng cho PĐT: danh sách tất cả LHP
                    const data = await api.get('/api/admin/lophocphan');
                    rows = (data && data.lopHocPhan) || [];
                } catch (e1) {
                    try {
                        // Fallback: /api/dangky/lopmo (chỉ SV dùng — PĐT sẽ bị 403)
                        const data = await api.get('/api/dangky/lopmo');
                        rows = (data && data.lopHocPhan) || [];
                    } catch (e2) {
                        note.textContent = 'Lấy danh sách không khả dụng.';
                        note.style.display = '';
                        document.getElementById('lhp-body').innerHTML = '';
                        document.getElementById('lhp-empty').style.display = 'none';
                        return;
                    }
                }
                note.style.display = 'none';
                renderLHP(rows);
            }

            window.loadLHP = loadLHP;

            async function init() {
                await Promise.all([loadDanhMuc(), loadLHP()]);
            }
            init();
        })();
    </script>
</body>
</html>
