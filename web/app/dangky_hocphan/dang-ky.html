<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký học phần — Cổng thông tin Đào tạo tín chỉ — UTH</title>
    <link rel="icon" type="image/png" href="/images/logo_spinner.png">
    <link rel="stylesheet" href="../../css/shared.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header__brand">
            <span class="app-header__logo">🎓</span>
            <h1 class="app-header__title">Đăng ký học phần</h1>
        </div>
        <nav class="app-nav" id="app-nav"></nav>
        <div class="app-header__user" id="app-user"></div>
    </header>

    <main class="container">
        <!-- ================================================
             MÀN HÌNH 1: HỌC PHẦN ĐANG CHỜ ĐĂNG KÝ
        ================================================= -->
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">Học phần đang chờ đăng ký</h2>
                <div id="dot-status" class="badge badge--success">Đợt đang mở</div>
            </div>
            <div class="toolbar">
                <div class="pill-group" id="loai-hoc">
                    <button class="pill pill--active" data-loai="HOC_MOI" onclick="chonLoaiHoc(this)">Học mới</button>
                    <button class="pill" data-loai="HOC_LAI" onclick="chonLoaiHoc(this)">Học lại</button>
                    <button class="pill" data-loai="CAI_THIEN" onclick="chonLoaiHoc(this)">Học cải thiện</button>
                </div>
                <input type="search" id="search-input" class="input" placeholder="🔍 Tìm theo mã lớp / môn học..." oninput="renderClassList()">
                <select id="filter-khoi" class="input input--select" onchange="renderClassList()">
                    <option value="">Tất cả khối</option>
                    <option value="CNTT">Công nghệ thông tin</option>
                    <option value="KTT">Kinh tế - Tài chính</option>
                    <option value="XD">Xây dựng</option>
                </select>
                <span class="badge badge--info" id="credit-counter"></span>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Mã LHP</th>
                        <th>Môn học</th>
                        <th>Số TC</th>
                        <th>Lịch học</th>
                        <th>Sĩ số</th>
                        <th>Giảng viên</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="class-list-body"></tbody>
            </table>
            <p class="card__note" id="class-list-empty" style="display:none">Không có dữ liệu</p>
        </section>

        <!-- ================================================
             HỌC PHẦN ĐÃ ĐĂNG KÝ TRONG HỌC KỲ NÀY
        ================================================= -->
        <section class="card">
            <div class="card__header">
                <h2 class="card__title">Học phần đã đăng ký trong học kỳ này</h2>
                <span class="badge badge--info" id="registered-total"></span>
            </div>
            <table class="table">
                <thead>
                    <tr><th>Mã LHP</th><th>Môn học</th><th>Số TC</th><th>Ngày ĐK</th><th>Trạng thái</th><th>Thao tác</th></tr>
                </thead>
                <tbody id="registered-body"></tbody>
            </table>
            <p class="card__note" id="registered-empty" style="display:none">Bạn chưa đăng ký lớp nào.</p>
        </section>
    </main>

    <footer class="app-footer"><p>Đồ án Hệ Quản trị CSDL — Module Đăng ký học phần (TV3)</p></footer>
    <div id="toast-container" class="toast-container"></div>

    <script src="../../js/api.js"></script>
    <script src="../../js/shared.js"></script>
    <script src="../../js/dangky.js"></script>
</body>
</html>
